<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Gringotts</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
}

.container{
    width:400px;
    background:white;
    border-radius:15px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#b8860b;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#555;
    margin-bottom:25px;
}

.info{
    background:#fff7d6;
    padding:10px;
    border-radius:8px;
    margin-bottom:20px;
    text-align:center;
    color:#444;
}

form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

input{
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#b8860b;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#8b6508;
}

.error{
    margin-top:15px;
    text-align:center;
    color:red;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

```
<h1>Gringotts Bank</h1>

<p class="subtitle">
    Conversor de Moneda Magica
</p>

<div class="info">
    1 Galeon = 5 Euros
</div>

<form action="conversor" method="post">

    <input
        type="number"
        name="euros"
        step="0.01"
        placeholder="Introduce euros"
        required>

    <button type="submit">
        Convertir a Galeones
    </button>

</form>

<div class="error">
    Aqui apareceran los errores
</div>
```

</div>

</body>
</html>


</body>
</html>
